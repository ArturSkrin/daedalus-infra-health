# Show the drill-in's "Verify in" evidence links on demo scenarios, for quick local testing without
# spinning up a live source. LOGS_URL_TEMPLATE/TRACES_URL_TEMPLATE are unset by default -- nothing shows
# until an operator deliberately sets one, which is exactly what this overlay does for local testing.
#
#   docker compose -f docker-compose.yaml -f docker-compose.demo-links.yaml up -d --build
#
# The base docker-compose.yaml stays untouched, so the normal `docker compose up` flow is unaffected.
# The links open in *your* browser, not inside the compose network, so they point at localhost:$TRACKER_PORT
# (the frontend's published port) rather than a container hostname -- and at two tiny static pages
# (frontend/public/mock-tools/) that just echo back the params they were given, clearly labeled as
# placeholders. Point these at your real Grafana/Loki/Jaeger instead, once you have one.
services:
  backend:
    environment:
      LOGS_URL_TEMPLATE: "http://localhost:${TRACKER_PORT:-8080}/mock-tools/logs.html?tenant={tenant}&service={service}"
      TRACES_URL_TEMPLATE: "http://localhost:${TRACKER_PORT:-8080}/mock-tools/traces.html?tenant={tenant}&service={service}"
