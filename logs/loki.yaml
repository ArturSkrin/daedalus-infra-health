# Loki for the fleet: one process, chunks on local disk, 14 days kept. Runs next to the tracker (docker-compose.fleet-logs.yaml).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  # a day of the whole fleet took 20-35 s with 21 hosts; the 30 s default cut the answer off mid-way
  http_server_read_timeout: 2m
  http_server_write_timeout: 2m

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h            # 14 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  query_timeout: 2m
  split_queries_by_interval: 1h     # a day query becomes 24 hour-long pieces, run in parallel and cached one by one

# Finished hours of a range query are kept, so the 24 h counts on /ops only compute the newest hour again
query_range:
  align_queries_with_step: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

querier:
  max_concurrent: 4                 # the hub has 4 cores, shared with everything else on it

compactor:
  working_directory: /loki/compactor
  retention_enabled: true           # without it retention_period deletes nothing
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
