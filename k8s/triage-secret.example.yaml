# Optional. Apply a copy of this with real values to switch the tracker to live data:
#   kubectl -n daedalus apply -f triage-secret.yaml && kubectl -n daedalus rollout restart deploy/backend
apiVersion: v1
kind: Secret
metadata:
  name: triage
  namespace: daedalus
stringData:
  TRIAGE_BASE_URL: "https://triage.example.com"
  TRIAGE_TENANT: "digital-purchases"
  TRIAGE_TOKEN: ""
