name: Build and push images

on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/arturskrin/daedalus-infra-health-${{ matrix.part }}
          # main is "latest"; a feature branch gets its own tag (feat/fleet-agent -> feat-fleet-agent)
          TAG=$([ "$GITHUB_REF_NAME" = main ] && echo latest || echo "${GITHUB_REF_NAME//\//-}")
          docker build -f ${{ matrix.part }}/Dockerfile -t $IMAGE:$TAG -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:$TAG
          docker push $IMAGE:${{ github.sha }}
